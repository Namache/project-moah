<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:">
  <title>Project Moah</title>
  <link rel="stylesheet" href="mini.css">
</head>
<body>
  <!-- The small oval timer shown in the corner of the screen while Moah is minimized or in the tray. -->
  <button id="timer" class="oval focus" type="button" aria-label="Open Project Moah">
    <svg class="ring" viewBox="0 0 26 26" aria-hidden="true">
      <circle class="track" cx="13" cy="13" r="10.5"/>
      <circle class="arc" cx="13" cy="13" r="10.5" transform="rotate(-90 13 13)"/>
      <g class="pause"><rect x="9.6" y="8.6" width="2.3" height="8.8" rx="1"/><rect x="14.1" y="8.6" width="2.3" height="8.8" rx="1"/></g>
      <g class="cup" transform="translate(7.4 7.6) scale(.47)"><path d="M16 8a1 1 0 0 1 1 1v8a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4V9a1 1 0 0 1 1-1h14a4 4 0 1 1 0 8h-1"/></g>
    </svg>
    <span class="time" id="time">25:00</span>
    <span class="count" id="count" hidden></span>
  </button>
  <script src="mini.js"></script>
</body>
</html>
