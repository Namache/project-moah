<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f8f9f6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121614" media="(prefers-color-scheme: dark)" />
    <!-- Paints the window in the system's theme before the app's scripts and styles load, so a dark desktop never flashes white. -->
    <style>html { background: #f8f9f6; } @media (prefers-color-scheme: dark) { html { background: #121614; } }</style>
    <meta name="description" content="Project Moah keeps your projects and their development context organized locally." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Project Moah</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
