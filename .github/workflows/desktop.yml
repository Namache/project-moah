name: Desktop packages

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  linux-flatpak:
    name: Build Linux Flatpak
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json

      - name: Install Linux Flatpak build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder elfutils
          flatpak remote-add --if-not-exists --user flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive flathub \
            org.freedesktop.Platform//25.08 \
            org.freedesktop.Sdk//25.08

      - name: Install backend dependencies
        run: python -m pip install -e './backend[dev]' pyinstaller

      - name: Check backend
        run: |
          python -m pytest backend/tests
          python -m ruff check backend
          python -m ruff format --check backend

      - name: Build frontend
        run: |
          npm ci --prefix frontend
          npm run check --prefix frontend
          npm run test --prefix frontend
          npm run build --prefix frontend

      - name: Build native backend sidecar
        run: python scripts/build-backend-sidecar.py

      - name: Build Flatpak bundle
        run: |
          npm ci --prefix desktop
          npm run build:linux --prefix desktop

      - name: Upload Flatpak bundle
        uses: actions/upload-artifact@v4
        with:
          name: project-moah-linux-flatpak
          path: desktop/dist/*.flatpak
          if-no-files-found: error

  linux-deb:
    name: Build Debian/Ubuntu package
    # The oldest supported base, so the package also runs on Debian 12 and Ubuntu 22.04.
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json

      - name: Install backend dependencies
        run: python -m pip install -e './backend' pyinstaller

      - name: Build frontend
        run: |
          npm ci --prefix frontend
          npm run build --prefix frontend

      - name: Build native backend sidecar
        run: python scripts/build-backend-sidecar.py

      - name: Build the .deb
        run: |
          npm ci --prefix desktop
          npm run build:deb --prefix desktop

      - name: Install it and check the agent connection and the window
        run: |
          sudo apt-get update
          sudo apt-get install -y ./desktop/dist/ProjectMoah-*.deb
          python scripts/check-agent-launch.py project-moah-mcp
          npm install --no-save --prefix "$RUNNER_TEMP/pw" playwright@1.63.0
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" xvfb-run -a node scripts/check-desktop-window.cjs "/opt/Project Moah/project-brain-desktop" deb "$RUNNER_TEMP/screens"

      - name: Check it installs and connects on Debian 12
        run: |
          docker run --rm -v "$PWD:/w" debian:12 bash -c '
            apt-get update -qq &&
            apt-get install -y -qq /w/desktop/dist/ProjectMoah-*.deb python3 &&
            python3 /w/scripts/check-agent-launch.py project-moah-mcp'

      - name: Upload the .deb
        uses: actions/upload-artifact@v4
        with:
          name: project-moah-linux-deb
          path: desktop/dist/ProjectMoah-*.deb
          if-no-files-found: error

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screens-linux-deb
          path: ${{ runner.temp }}/screens
          if-no-files-found: ignore

  windows-exe:
    name: Build Windows installer
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json

      - name: Install backend dependencies
        run: python -m pip install -e './backend[dev]' pyinstaller

      - name: Check backend
        run: |
          python -m pytest backend/tests
          python -m ruff check backend
          python -m ruff format --check backend

      - name: Build frontend
        run: |
          npm ci --prefix frontend
          npm run check --prefix frontend
          npm run test --prefix frontend
          npm run build --prefix frontend

      - name: Build native backend sidecar
        run: python scripts/build-backend-sidecar.py

      - name: Build the Windows installer
        run: |
          npm ci --prefix desktop
          npm run build:windows --prefix desktop

      - name: Install it silently
        shell: pwsh
        run: |
          $setup = Get-ChildItem desktop/dist/ProjectMoah-Setup-*.exe | Select-Object -First 1
          Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait
          $app = Get-ChildItem "$env:LOCALAPPDATA\Programs", "$env:ProgramFiles" -Recurse -Depth 1 -Filter 'Project Moah.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $app) { throw 'Project Moah.exe was not installed' }
          "MOAH_APP=$($app.FullName)" >> $env:GITHUB_ENV
          "MOAH_BACKEND=$(Join-Path $app.DirectoryName 'resources\bin\project-brain-backend.exe')" >> $env:GITHUB_ENV

      - name: Check the agent connection and the window
        run: |
          python scripts/check-agent-launch.py "$MOAH_BACKEND" --mcp
          npm install --no-save --prefix "$RUNNER_TEMP/pw" playwright@1.63.0
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" node scripts/check-desktop-window.cjs "$MOAH_APP" windows "$RUNNER_TEMP/screens"

      - name: Upload the Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: project-moah-windows-exe
          path: desktop/dist/ProjectMoah-Setup-*.exe
          if-no-files-found: error

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screens-windows
          path: ${{ runner.temp }}/screens
          if-no-files-found: ignore

  release:
    name: Publish the packages to a GitHub Release
    # Only for version tags, and only when every package built and passed its checks.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux-flatpak, linux-deb, windows-exe]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download the packages
        uses: actions/download-artifact@v4
        with:
          pattern: project-moah-*
          merge-multiple: true
          path: dist

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          home="https://github.com/$GITHUB_REPOSITORY"
          cat > notes.md <<EOF
          | Your system | Download |
          | --- | --- |
          | Windows 10 or 11 | ProjectMoah-Setup-x64.exe |
          | Debian 12+, Ubuntu 22.04+, Linux Mint | ProjectMoah-amd64.deb |
          | Fedora, Bazzite and other Linux with Flatpak | ProjectMoah-x86_64.flatpak |

          Install steps for each system are in the [README]($home#install). Everything stays on your computer: no account, no cloud, no telemetry.

          The Windows installer is not code-signed yet, so Windows may say "Windows protected your PC". Choose **More info**, then **Run anyway**. See the [code signing policy]($home#code-signing-policy).

          EOF
          gh release create "$GITHUB_REF_NAME" dist/*.flatpak dist/*.deb dist/*.exe --repo "$GITHUB_REPOSITORY" --title "Project Moah $GITHUB_REF_NAME" --notes "$(cat notes.md)" --generate-notes
